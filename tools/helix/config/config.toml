[editor]
bufferline = "multiple"
color-modes = true
completion-replace = true
cursorline = true
end-of-line-diagnostics = "hint"
line-number = "relative"
mouse = true
rulers = [120]
scrolloff = 10
shell = ["nu", "--stdin", "-c"]
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.gutters]
layout = ["diff", "diagnostics", "line-numbers", "spacer"]

[editor.indent-guides]
character = "╎"
render = true

[editor.inline-diagnostics]
cursor-line = "hint"

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.soft-wrap]
enable = false

[editor.whitespace.render]
nbsp = "all"
newline = "none"
nnbsp = "all"
space = "none"
tab = "all"

[keys.normal]
A-d = "delete_selection"
C-j = ["page_cursor_half_down", "align_view_center"]
C-k = ["page_cursor_half_up", "align_view_center"]
H = ["insert_newline"]
S-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
S-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
X = "select_line_above"
d = "delete_selection_noyank"
x = "select_line_below"

[keys.normal.space]
W = ":toggle soft-wrap.enable"

